<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon-zorando.svg">
    <!-- PWA meta tags removed -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"></noscript>
    
    <style>
      /* Prevent Flash of Unstyled Content (FOUC) */
      body {
        background-color: #ffffff;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #root:empty {
        background: #ffffff;
        height: 100vh;
        width: 100vw;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .app-ready {
        animation: fadeIn 0.3s ease-in-out;
      }
    </style>

    <!-- Google tag (gtag.js) - Lazy loaded on interaction & Consent Mode -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Consent Mode V2 par défaut
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'analytics_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });
      
      gtag('js', new Date());

      function loadGTM() {
        if (window.gtmLoaded) return;
        window.gtmLoaded = true;
        
        var script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-7JLYM1QX3C'; 
        script.async = true;
        document.head.appendChild(script);

        ['scroll','mousemove','touchstart','click','keydown'].forEach(function(evt) {
          window.removeEventListener(evt, loadGTM);
        });
      }

      window.loadGTM = loadGTM; // Rend la fonction globale pour la CookieBanner

      ['scroll','mousemove','touchstart','click','keydown'].forEach(function(evt) {
        window.addEventListener(evt, loadGTM, { passive: true, once: true });
      });

      window.addEventListener('load', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() { setTimeout(loadGTM, 2500); });
        } else {
          setTimeout(loadGTM, 2500);
        }
      });
    </script>
    <!--head-injection-->
    <!--seo-injection-->
  </head>
  <body>
    <div id="root"></div>


    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
